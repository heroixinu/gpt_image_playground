name: Deploy to Vercel

on:
  push:
    branches:
      - main
    tags: ['v*']
  workflow_run:
    workflows: ['Build Desktop Client']
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide deployment trigger
        id: deployment
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 配置了签名私钥时，推送 tag 先构建客户端，构建成功后由 workflow_run 部署；未配置时推送 tag 直接部署
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ -n "$SIGNING_KEY" ]] && deploy=true || deploy=false
            echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ -z "$SIGNING_KEY" ]] && deploy=true || deploy=false
            [[ "$deploy" == false ]] && echo "Signing key is set. Vercel deployment will run after the desktop client build."
            echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main 上任何提交（包括 PR 合并及 Sync fork）均部署，不依赖版本号或上游 Release。
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=false" >> "$GITHUB_OUTPUT"
      - name: Call Vercel Deploy Hook
        if: ${{ steps.deployment.outputs.deploy == 'true' && env.VERCEL_DEPLOY_HOOK != '' }}
        run: |
          curl --fail-with-body --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Vercel deploy hook triggered."
      - name: Skip if Hook URL is missing
        if: ${{ steps.deployment.outputs.deploy == 'true' && env.VERCEL_DEPLOY_HOOK == '' }}
        run: |
          echo "VERCEL_DEPLOY_HOOK secret is not set. Skipping Vercel deployment."
